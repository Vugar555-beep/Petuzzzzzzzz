workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 120
    environment:
      java: 17
    scripts:
      - name: Build Android APK
        script: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      
